[package]
name = "hasher-web-server"
description = "Hasher — server HTTP (axum) che serve la PWA dietro a un reverse proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "hasher-web-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.7", features = ["trace", "set-header"] }
# In release i file di `dist/` sono embeddati nel binario; in debug vengono letti dal disco a ogni richiesta.
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
