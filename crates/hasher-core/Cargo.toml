[package]
name = "hasher-core"
description = "Hasher — algoritmi di hash, parser dei file di checksum ed esportazione (nativo e WebAssembly)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Entry point del Web Worker (`worker::worker_main`), compilato solo per wasm32 (docs/PIANO.md §5.3).
worker = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
]

[dependencies]
# Hashing (trait StreamHasher proprio: nessuna dipendenza dalla versione del trait `digest` esterno)
md2 = "0.11"
md4 = "0.11"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
ripemd = "0.2"
blake2 = "0.11"
blake3 = "1.8"
crc32fast = "1.5"
crc = "3.4"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
hex.workspace = true

# Esportazione
csv = "1.3"
docx-rs = "0.4"
rust_xlsxwriter = "0.99"

# Dati
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
log.workspace = true
humansize.workspace = true

# Web Worker (feature `worker`)
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Blob",
    "DedicatedWorkerGlobalScope",
    "File",
    "MessageEvent",
    "Performance",
    "WorkerGlobalScope",
    "console",
] }
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Su wasm `SystemTime::now()` non esiste: con la feature `wasm` usa `js_sys::Date`.
rust_xlsxwriter = { version = "0.99", features = ["wasm"] }
