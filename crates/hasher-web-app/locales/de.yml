help:
  title: "Hilfe"
  tab_guide: "Anleitung"
  tab_shortcuts: "Tastenkürzel"
  tab_about: "Info"
  guide_drop_title: "Ziehen und Ablegen"
  guide_drop_text: "Ziehen Sie eine oder mehrere Dateien oder ganze Ordner auf das Fenster: Die Berechnung der Hashes beginnt sofort. Sie können auch die Schaltflächen „Dateien öffnen“ und „Ordner öffnen“ verwenden (Ctrl+O, Ctrl+Shift+O). Ordner werden gemäß Ihren Einstellungen durchsucht (Unterordner, versteckte Dateien, symbolische Links)."
  guide_views_title: "Eine oder mehrere Dateien"
  guide_views_text: "Bei einer einzelnen Datei erhalten Sie eine Karte mit Name, Pfad, Größe, Datumsangaben, Attributen und allen Hashes, jeweils mit einer Schaltfläche zum Kopieren. Bei mehreren Dateien erscheint eine Tabelle: Wählen Sie den Algorithmus für die Hash-Spalte, filtern Sie nach Namen und klicken Sie auf eine Zeile, um sie aufzuklappen und alle Details zu sehen."
  guide_verify_title: "Mit einem erwarteten Hash überprüfen"
  guide_verify_text: "Drücken Sie Ctrl+V oder öffnen Sie den Bereich „Überprüfen“ und fügen Sie den vom Autor der Datei veröffentlichten Hash ein. Leerzeichen, Doppelpunkte und Groß-/Kleinschreibung werden ignoriert, und der Algorithmus wird anhand der Länge erkannt: Bei Übereinstimmung erscheint eine grüne Bestätigung, andernfalls eine rote Warnung."
  guide_checksum_title: "Prüfsummendateien"
  guide_checksum_text: "Legen Sie eine .md5-, .sha1-, .sha256-, .sha512- oder .sfv-Datei ab (GNU- oder BSD-Format): Hasher überprüft jede aufgeführte Datei und zeigt für jede OK, FEHLGESCHLAGEN oder FEHLT an."
  guide_compare_title: "Zwei Dateien vergleichen"
  guide_compare_text: "Wählen Sie zwei Zeilen mit Ctrl+Klick aus, legen Sie zwei Dateien bei gedrückter Ctrl-Taste ab oder legen Sie eine Datei bei gedrückter Shift-Taste ab, um sie mit der zuletzt hinzugefügten zu vergleichen: Der Bereich „Überprüfen“ zeigt für jeden Algorithmus, ob die Dateien identisch sind."
  guide_export_title: "Export"
  guide_export_text: "Der Export (Ctrl+E) speichert die Ergebnisse als Text, CSV, JSON, Excel (XLSX), Word (DOCX) oder als Prüfsummendatei, die Sie für spätere Überprüfungen wiederverwenden können."
  guide_portable_title: "Portable Einstellungen"
  guide_portable_text: "Die Einstellungen werden in der Datei hasher.settings.json neben dem Programm gespeichert, sodass Sie das Programm samt Einstellungen auf einem USB-Stick mitnehmen können. Ist dieser Ordner nicht beschreibbar, wird stattdessen Ihr Benutzerprofil verwendet."
