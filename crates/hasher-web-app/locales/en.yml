help:
  title: "Help"
  tab_guide: "Guide"
  tab_shortcuts: "Shortcuts"
  tab_about: "About"
  guide_drop_title: "Drag and drop"
  guide_drop_text: "Drag one or more files, or whole folders, onto the window: hashing starts immediately. You can also use the Open files and Open folder buttons (Ctrl+O, Ctrl+Shift+O). Folders are scanned according to your settings (subfolders, hidden files, symbolic links)."
  guide_views_title: "One file or many"
  guide_views_text: "With a single file you get a card with name, path, size, dates, attributes and every hash, each with a copy button. With several files a table appears: choose the algorithm of the hash column, filter by name and click a row to expand it and see all the details."
  guide_verify_title: "Verify against an expected hash"
  guide_verify_text: "Press Ctrl+V or open the Verify panel and paste the hash published by the file's author. Spaces, colons and letter case are ignored and the algorithm is recognised from the length: a green confirmation appears when it matches, a red warning otherwise."
  guide_checksum_title: "Checksum files"
  guide_checksum_text: "Drop a .md5, .sha1, .sha256, .sha512 or .sfv file (GNU or BSD format): Hasher verifies every listed file and shows OK, FAILED or MISSING for each one."
  guide_compare_title: "Compare two files"
  guide_compare_text: "Select two rows with Ctrl+click, drop two files while holding Ctrl, or drop a file while holding Shift to compare it with the last one added: the Verify panel shows, for every algorithm, whether the files are identical."
  guide_export_title: "Export"
  guide_export_text: "Export (Ctrl+E) saves the results as text, CSV, JSON, Excel (XLSX), Word (DOCX) or as a checksum file you can reuse for future verification."
  guide_portable_title: "Portable settings"
  guide_portable_text: "Settings are stored in hasher.settings.json next to the program, so you can carry it on a USB stick. If that folder is not writable, your user profile is used instead."
