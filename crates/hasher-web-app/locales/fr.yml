help:
  title: "Aide"
  tab_guide: "Guide"
  tab_shortcuts: "Raccourcis"
  tab_about: "À propos"
  guide_drop_title: "Glisser-déposer"
  guide_drop_text: "Faites glisser un ou plusieurs fichiers, ou des dossiers entiers, sur la page : le calcul des hash démarre immédiatement. Vous pouvez aussi utiliser les boutons Ouvrir des fichiers et Ouvrir un dossier (Ctrl+O, Ctrl+Shift+O). Les dossiers sont analysés selon vos paramètres (sous-dossiers, fichiers cachés)."
  guide_views_title: "Un ou plusieurs fichiers"
  guide_views_text: "Avec un seul fichier, vous obtenez une fiche avec le nom, la taille, la date de modification et chaque hash, chacun accompagné d'un bouton de copie (le navigateur ne révèle ni le chemin complet ni les attributs du fichier). Avec plusieurs fichiers, un tableau s'affiche avec le chemin dans le dossier : choisissez l'algorithme de la colonne du hash, filtrez par nom et cliquez sur une ligne pour la développer et afficher tous les détails."
  guide_verify_title: "Vérifier par rapport à un hash attendu"
  guide_verify_text: "Appuyez sur Ctrl+V ou ouvrez le panneau Vérifier et collez le hash publié par l'auteur du fichier. Les espaces, les deux-points et la casse sont ignorés, et l'algorithme est reconnu d'après la longueur : une confirmation verte s'affiche en cas de correspondance, un avertissement rouge dans le cas contraire."
  guide_checksum_title: "Fichiers de sommes de contrôle"
  guide_checksum_text: "Déposez un fichier .md5, .sha1, .sha256, .sha512 ou .sfv (format GNU ou BSD) avec les fichiers répertoriés, ou le dossier qui les contient : Hasher vérifie chaque fichier répertorié et affiche OK, ÉCHEC ou MANQUANT pour chacun d'eux. Les fichiers déjà présents dans la liste sont également utilisés."
  guide_compare_title: "Comparer deux fichiers"
  guide_compare_text: "Sélectionnez deux lignes avec Ctrl+clic, déposez deux fichiers en maintenant la touche Ctrl enfoncée, ou déposez un fichier en maintenant la touche Shift enfoncée pour le comparer au dernier ajouté : le panneau Vérifier indique, pour chaque algorithme, si les fichiers sont identiques."
  guide_export_title: "Exportation"
  guide_export_text: "L'exportation (Ctrl+E) télécharge les résultats au format texte, CSV, JSON, Excel (XLSX), Word (DOCX) ou sous forme de fichier de sommes de contrôle, réutilisable pour de futures vérifications."
  guide_portable_title: "Paramètres, hors ligne et installation"
  guide_portable_text: "Les paramètres sont enregistrés dans ce navigateur et retrouvés à la visite suivante. Après la première visite, Hasher fonctionne aussi hors ligne. Avec Chrome ou Edge, vous pouvez l'installer comme application (Aide → Installer comme application) : elle s'ouvre dans sa propre fenêtre depuis la barre des tâches ou le Dock, et vous pouvez y ouvrir les fichiers de sommes de contrôle via « Ouvrir avec »."
  version: "Version %{version}"
  developed_by: "Développé par %{company}"
  components: "Composants open source"
  licence_note: "Les textes complets des licences des polices sont distribués avec le programme."
  guide_privacy_title: "Tout reste dans votre navigateur"
  guide_privacy_text: "Les hash sont calculés sur votre ordinateur, dans le navigateur : aucun fichier n'est envoyé sur le réseau et le serveur ne fournit que l'application. Quand vous ouvrez un dossier, le navigateur peut demander « Importer N fichiers sur ce site ? » : vous pouvez confirmer, les fichiers sont seulement lus en local et ne quittent jamais votre appareil. La lecture se fait par blocs : même les fichiers de plusieurs gigaoctets fonctionnent."
