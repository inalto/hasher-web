help:
  title: "Aide"
  tab_guide: "Guide"
  tab_shortcuts: "Raccourcis"
  tab_about: "À propos"
  guide_drop_title: "Glisser-déposer"
  guide_drop_text: "Faites glisser un ou plusieurs fichiers, ou des dossiers entiers, sur la fenêtre : le calcul des hash démarre immédiatement. Vous pouvez aussi utiliser les boutons Ouvrir des fichiers et Ouvrir un dossier (Ctrl+O, Ctrl+Shift+O). Les dossiers sont analysés selon vos paramètres (sous-dossiers, fichiers cachés, liens symboliques)."
  guide_views_title: "Un ou plusieurs fichiers"
  guide_views_text: "Avec un seul fichier, vous obtenez une fiche avec le nom, le chemin, la taille, les dates, les attributs et chaque hash, chacun accompagné d'un bouton de copie. Avec plusieurs fichiers, un tableau s'affiche : choisissez l'algorithme de la colonne du hash, filtrez par nom et cliquez sur une ligne pour la développer et afficher tous les détails."
  guide_verify_title: "Vérifier par rapport à un hash attendu"
  guide_verify_text: "Appuyez sur Ctrl+V ou ouvrez le panneau Vérifier et collez le hash publié par l'auteur du fichier. Les espaces, les deux-points et la casse sont ignorés, et l'algorithme est reconnu d'après la longueur : une confirmation verte s'affiche en cas de correspondance, un avertissement rouge dans le cas contraire."
  guide_checksum_title: "Fichiers de sommes de contrôle"
  guide_checksum_text: "Déposez un fichier .md5, .sha1, .sha256, .sha512 ou .sfv (format GNU ou BSD) : Hasher vérifie chaque fichier répertorié et affiche OK, ÉCHEC ou MANQUANT pour chacun d'eux."
  guide_compare_title: "Comparer deux fichiers"
  guide_compare_text: "Sélectionnez deux lignes avec Ctrl+clic, déposez deux fichiers en maintenant la touche Ctrl enfoncée, ou déposez un fichier en maintenant la touche Shift enfoncée pour le comparer au dernier ajouté : le panneau Vérifier indique, pour chaque algorithme, si les fichiers sont identiques."
  guide_export_title: "Exportation"
  guide_export_text: "L'exportation (Ctrl+E) enregistre les résultats au format texte, CSV, JSON, Excel (XLSX), Word (DOCX) ou sous forme de fichier de sommes de contrôle, réutilisable pour de futures vérifications."
  guide_portable_title: "Paramètres portables"
  guide_portable_text: "Les paramètres sont enregistrés dans le fichier hasher.settings.json, à côté du programme : vous pouvez ainsi emporter le programme sur une clé USB. Si ce dossier n'est pas accessible en écriture, votre profil utilisateur est utilisé à la place."
