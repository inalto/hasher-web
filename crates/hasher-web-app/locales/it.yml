help:
  title: "Aiuto"
  tab_guide: "Guida"
  tab_shortcuts: "Scorciatoie"
  tab_about: "Informazioni"
  guide_drop_title: "Trascina e rilascia"
  guide_drop_text: "Trascina uno o più file, o intere cartelle, sulla finestra: il calcolo parte subito. In alternativa usa i pulsanti Apri file e Apri cartella (Ctrl+O, Ctrl+Shift+O). Le cartelle vengono esplorate secondo le impostazioni (sottocartelle, file nascosti, link simbolici)."
  guide_views_title: "Un file o molti"
  guide_views_text: "Con un solo file vedi una scheda con nome, percorso, dimensione, date, attributi e tutti gli hash, ciascuno con il pulsante copia. Con più file compare una tabella: scegli l'algoritmo della colonna hash, filtra per nome e fai clic su una riga per espanderla e vedere tutti i dettagli."
  guide_verify_title: "Verifica con un hash atteso"
  guide_verify_text: "Premi Ctrl+V o apri il pannello Verifica e incolla l'hash pubblicato dall'autore del file. Spazi, due punti e maiuscole vengono ignorati e l'algoritmo è riconosciuto dalla lunghezza: compare una conferma verde se corrisponde, altrimenti un avviso rosso."
  guide_checksum_title: "File di checksum"
  guide_checksum_text: "Trascina un file .md5, .sha1, .sha256, .sha512 o .sfv (formato GNU o BSD): Hasher verifica tutti i file elencati e mostra OK, FALLITO o MANCANTE per ciascuno."
  guide_compare_title: "Confronta due file"
  guide_compare_text: "Seleziona due righe con Ctrl+clic, oppure rilascia due file tenendo premuto Ctrl, oppure rilascia un file con Shift per confrontarlo con l'ultimo aggiunto: il pannello Verifica mostra per ogni algoritmo se i file sono identici."
  guide_export_title: "Esporta"
  guide_export_text: "Con Esporta (Ctrl+E) salvi i risultati come testo, CSV, JSON, Excel (XLSX), Word (DOCX) o come file di checksum riutilizzabile per verifiche future."
  guide_portable_title: "Impostazioni portabili"
  guide_portable_text: "Le impostazioni vengono salvate nel file hasher.settings.json accanto al programma, così puoi portarlo su una chiavetta USB. Se la cartella non è scrivibile si usa il profilo dell'utente."
