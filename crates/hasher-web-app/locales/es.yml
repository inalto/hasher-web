help:
  title: "Ayuda"
  tab_guide: "Guía"
  tab_shortcuts: "Atajos"
  tab_about: "Acerca de"
  guide_drop_title: "Arrastrar y soltar"
  guide_drop_text: "Arrastra uno o varios archivos, o carpetas enteras, a la ventana: el cálculo de los hashes empieza de inmediato. También puedes usar los botones Abrir archivos y Abrir carpeta (Ctrl+O, Ctrl+Shift+O). Las carpetas se exploran según tus ajustes (subcarpetas, archivos ocultos, enlaces simbólicos)."
  guide_views_title: "Uno o varios archivos"
  guide_views_text: "Con un solo archivo obtienes una ficha con nombre, ruta, tamaño, fechas, atributos y todos los hashes, cada uno con su botón de copia. Con varios archivos aparece una tabla: elige el algoritmo de la columna del hash, filtra por nombre y haz clic en una fila para expandirla y ver todos los detalles."
  guide_verify_title: "Verificar con un hash esperado"
  guide_verify_text: "Pulsa Ctrl+V o abre el panel Verificar y pega el hash publicado por el autor del archivo. Se ignoran los espacios, los dos puntos y las mayúsculas, y el algoritmo se reconoce por la longitud: aparece una confirmación verde si coincide y una advertencia roja en caso contrario."
  guide_checksum_title: "Archivos de sumas de verificación"
  guide_checksum_text: "Suelta un archivo .md5, .sha1, .sha256, .sha512 o .sfv (formato GNU o BSD): Hasher verifica cada archivo de la lista y muestra OK, FALLIDO o FALTANTE para cada uno."
  guide_compare_title: "Comparar dos archivos"
  guide_compare_text: "Selecciona dos filas con Ctrl+clic, suelta dos archivos manteniendo pulsada la tecla Ctrl, o suelta un archivo manteniendo pulsada la tecla Shift para compararlo con el último añadido: el panel Verificar muestra, para cada algoritmo, si los archivos son idénticos."
  guide_export_title: "Exportación"
  guide_export_text: "Exportar (Ctrl+E) guarda los resultados como texto, CSV, JSON, Excel (XLSX), Word (DOCX) o como un archivo de sumas de verificación que puedes reutilizar en futuras verificaciones."
  guide_portable_title: "Ajustes portátiles"
  guide_portable_text: "Los ajustes se guardan en el archivo hasher.settings.json junto al programa, de modo que puedes llevar el programa en una memoria USB. Si no se puede escribir en esa carpeta, se usa tu perfil de usuario."
