name: Set up the web build toolchain
description: >
  Rust stable with the wasm32 target, brotli, the wasm-bindgen CLI at the exact version pinned in
  Cargo.lock (prebuilt release, cargo install as a fallback) and a recent binaryen (wasm-opt).
  Call it after actions/checkout; scripts/build-web.sh then produces dist/.

inputs:
  binaryen-version:
    description: binaryen release used for wasm-opt (same as the Dockerfile)
    default: '123'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install brotli
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends brotli

    # The CLI must match the wasm-bindgen crate in Cargo.lock: scripts/build-web.sh refuses to run otherwise.
    - name: Install the wasm-bindgen CLI (version from Cargo.lock)
      shell: bash
      run: |
        set -euo pipefail
        WBG="$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"/\1/p}' Cargo.lock | head -n1)"
        test -n "${WBG}"
        mkdir -p "${HOME}/.local/bin"
        TMP="$(mktemp -d)"
        if curl -fsSL --retry 3 \
             "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WBG}/wasm-bindgen-${WBG}-x86_64-unknown-linux-musl.tar.gz" \
             | tar -xz -C "${TMP}" --strip-components=1; then
          install -m 0755 "${TMP}/wasm-bindgen" "${HOME}/.local/bin/wasm-bindgen"
        else
          echo "::warning::Prebuilt wasm-bindgen ${WBG} not available, falling back to cargo install"
          cargo install --locked wasm-bindgen-cli --version "${WBG}" --root "${HOME}/.local"
        fi
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        "${HOME}/.local/bin/wasm-bindgen" --version

    # Ubuntu's binaryen package lags behind the features rustc emits; use the upstream static release.
    - name: Install binaryen (wasm-opt)
      shell: bash
      env:
        BINARYEN_VERSION: ${{ inputs.binaryen-version }}
      run: |
        set -euo pipefail
        TMP="$(mktemp -d)"
        curl -fsSL --retry 3 \
          "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
          | tar -xz -C "${TMP}" --strip-components=1
        mkdir -p "${HOME}/.local/bin"
        install -m 0755 "${TMP}/bin/wasm-opt" "${HOME}/.local/bin/wasm-opt"
        "${HOME}/.local/bin/wasm-opt" --version
