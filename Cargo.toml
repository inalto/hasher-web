[workspace]
resolver = "2"
members = ["crates/hasher-core", "crates/hasher-web-app", "crates/hasher-web-server"]
# `cargo build/test/clippy` senza `-p` toccano solo i crate nativi; l'app è wasm32 (scripts/build-web.sh).
default-members = ["crates/hasher-core", "crates/hasher-web-server"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
authors = ["Martini Multimedia s.a.s."]
publish = false
repository = "https://github.com/inalto/hasher-web"

[workspace.dependencies]
hasher-core = { path = "crates/hasher-core" }
# La versione di wasm-bindgen DEVE coincidere con quella della CLI `wasm-bindgen` (scripts/build-web.sh la verifica).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = "0.3.106"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
log = "0.4"
hex = "0.4"
humansize = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
